spring:
  flyway:
    enabled: true
    locations: classpath:migration/versions
    baselineOnMigrate: true
    baselineVersion: 0

  datasource:
    url: jdbc:postgresql://localhost:5432/rrhh-digitaldoc
    username: sa
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: adm-rrhh-digitaldoc
      poolName: FwkCNAHikariCP
      minimumIdle: 2
      maximumPoolSize: 5
      idleTimeout: 30000
      maxLifetime: 2000000
      connectionTimeout: 30000
      initializationFailTimeout: 0

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

fwkcna:
  jpa:
    data-migration:
      disabled: false

cardgenerator:
  base-url: http://localhost:8081

fwkcna:
  buckets:
    - id: rrhh-documents
      bucket-name: rrhh-documents
      enabled: true
      url: http://localhost:9000
      provider: minio
      credentials:
        access-key: minio
        secret-key: minio123

logging:
  level:
    org.flywaydb: DEBUG
